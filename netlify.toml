[build]
  # Wipe Next's output/cache (restored by Netlify) before building so removed
  # routes/middleware actually drop out of the deploy. (Do NOT remove .netlify —
  # that's the plugin's workspace and breaks the build.)
  command = "rm -rf .next && npm run build"
  publish = ".next"

# Official Next.js runtime — sets up SSR/route handlers and caching.
[[plugins]]
  package = "@netlify/plugin-nextjs"
