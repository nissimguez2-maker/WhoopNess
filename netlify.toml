[build]
  # Force a clean build — wipe any restored Next/Netlify cache so deletions (e.g.
  # removed middleware/routes) actually take effect in the output.
  command = "rm -rf .next .netlify && npm run build"
  publish = ".next"

# Official Next.js runtime — sets up SSR/route handlers and caching.
[[plugins]]
  package = "@netlify/plugin-nextjs"
