[build]
  command = "npm run build"
  # Next.js build output (the API-created site defaulted publish to the repo root,
  # which the Next runtime rejects — "publish dir cannot equal the base dir").
  publish = ".next"

# Official Next.js runtime — sets up SSR/route handlers, middleware (edge), and caching.
[[plugins]]
  package = "@netlify/plugin-nextjs"
